rules:
  - id: koa-insecure-samesite
    message: |
      Insecure SameSite setting detected (value "None"). 
      Cookies with `SameSite: "None"` are sent in third‐party contexts and can open you to CSRF. 
      Change to `sameSite: "Lax"` (minimum) or `"Strict"` if possible.
    severity: WARNING
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      technology: koa

    # Option A: match any object literal that includes `sameSite: "None"` (or 'None')
    patterns:
      - pattern-either:
          - pattern: |
              { $$_key: $$_value, ..., sameSite: "None", ... }
          - pattern: |
              { $$_key: $$_value, ..., sameSite: 'None', ... }

    # Option B: match ctx.cookies.set(...) calls with sameSite: "None" (or 'None')
      - pattern-either:
          - pattern: |
              ctx.cookies.set($COOKIENAME, $COOKIEVAL, { ..., sameSite: "None", ... })
          - pattern: |
              ctx.cookies.set($COOKIENAME, $COOKIEVAL, { ..., sameSite: 'None', ... })

    # Option C: match koa-session config objects with sameSite: "None" (or 'None')
      - pattern-either:
          - pattern: |
              session({
                key: $_key,
                ..., 
                sameSite: "None",
                ...
              }, $_app)
          - pattern: |
              session({
                key: $_key,
                ..., 
                sameSite: 'None',
                ...
              }, $_app)
