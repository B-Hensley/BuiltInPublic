rules:
  - id: react-dangerously-set-inner-html
    pattern: <div dangerouslySetInnerHTML={{ __html: $HTML }} />
    message: "⚠️ Using dangerouslySetInnerHTML can lead to XSS. Avoid or sanitize input."
    severity: WARNING
    languages:
      - javascript
      - typescript
    metadata:
      category: security
      technology: react
        - react
        - nextjs
