name: Sync upstream → development + Semgrep scan

on:
  schedule:
    - cron: "0 2 * * *"  # Every night at 2 AM UTC
  workflow_dispatch:

jobs:
  sync-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout development
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: development

      - name: Configure upstream remote
        run: |
          git remote remove upstream || true
          git remote add upstream https://github.com/Christin-paige/codeSphere.git
          git fetch upstream development

      - name: Merge upstream/development → development with conflict resolution
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git merge -X theirs upstream/development || {
            echo "Merge conflict detected. Attempting manual resolution..."

            # Accept upstream version of dependabot.yml
            git checkout --theirs .github/dependabot.yml
            git add .github/dependabot.yml

            # Commit the resolved merge
            git commit -m "Resolved conflict: prefer upstream .github/dependabot.yml"
          }

      - name: 🔍 Run Semgrep (default + owasp-top-ten + custom)
        uses: returntocorp/semgrep-action@v2
        with:
          # ensure CLI ≥ 1.76.0 (we'll use 1.80.0 here)
          semgrep_version: 1.80.0
          # comma-separated list of rule paths or published rules
          config: p/default,p/owasp-top-ten,security/semgrep/general.yml
          # optionally ignore your seed file which contains bcrypt hashes
          exclude: supabase/seed.sql

      - name: Push merged changes
        if: ${{ success() }}
        run: git push origin development
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
